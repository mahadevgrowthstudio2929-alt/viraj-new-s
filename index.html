
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#070b12">

  <meta name="description"
        content="Analyst Viraj — Cricket Match Analysis & Trading Insights.">

  <title>Analyst Viraj — Cricket Analysis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 50% 10%, rgba(214,255,0,.12), transparent 32%),
        radial-gradient(circle at 10% 90%, rgba(0,174,255,.10), transparent 35%),
        #070b12;
      color: #ffffff;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .page {
      min-height: 100svh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      position: relative;
      text-align: center;
      padding: 28px 20px 22px;
      border: 1px solid rgba(214,255,0,.20);
      border-radius: 26px;
      background:
        linear-gradient(145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.018));
      box-shadow:
        0 0 45px rgba(214,255,0,.07),
        inset 0 0 30px rgba(255,255,255,.018);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -100px;
      left: 50%;
      width: 220px;
      height: 220px;
      transform: translateX(-50%);
      background: rgba(214,255,0,.09);
      filter: blur(55px);
      pointer-events: none;
    }

    .live {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(214,255,0,.08);
      border: 1px solid rgba(214,255,0,.20);
      color: #dfff4f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 17px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #dfff00;
      box-shadow: 0 0 10px #dfff00;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }

    .logo-wrap {
      position: relative;
      z-index: 2;
      width: 92px;
      height: 92px;
      margin: 0 auto 15px;
      padding: 3px;
      border-radius: 24px;
      background: linear-gradient(135deg, #dfff00, #00b7ff);
      box-shadow:
        0 0 25px rgba(214,255,0,.18),
        0 0 35px rgba(0,183,255,.10);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 21px;
      background: #0a0f17;
    }

    h1 {
      position: relative;
      z-index: 2;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(25px, 8vw, 34px);
      font-weight: 800;
      letter-spacing: .5px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    h1 span {
      color: #dfff00;
      text-shadow: 0 0 18px rgba(214,255,0,.25);
    }

    .subtitle {
      position: relative;
      z-index: 2;
      color: #aeb8c7;
      font-size: 13px;
      line-height: 1.55;
      max-width: 320px;
      margin: 0 auto 19px;
    }

    .stats {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 10px 5px;
      border-radius: 13px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
    }

    .stat strong {
      display: block;
      color: #f3f6fb;
      font-size: 13px;
      font-weight: 800;
    }

    .stat small {
      display: block;
      margin-top: 3px;
      color: #7f8a9b;
      font-size: 9px;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    .status {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #8f9bad;
      font-size: 10px;
      margin-bottom: 14px;
    }

    .status i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #35e68b;
      box-shadow: 0 0 9px rgba(53,230,139,.8);
    }

    .join-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      color: #071008;
      background: linear-gradient(135deg, #e5ff21, #b9ed00);
      box-shadow:
        0 10px 30px rgba(214,255,0,.18),
        inset 0 1px 0 rgba(255,255,255,.45);
      font-family: "Inter", sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .2px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .join-btn:active {
      transform: scale(.97);
      box-shadow: 0 5px 18px rgba(214,255,0,.12);
    }

    .btn-main {
      display: block;
      font-size: 15px;
    }

    .btn-sub {
      display: block;
      margin-top: 3px;
      font-size: 9px;
      opacity: .62;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .note {
      position: relative;
      z-index: 2;
      margin-top: 12px;
      color: #667183;
      font-size: 9px;
    }

    @media (max-height: 650px) {
      .card {
        padding: 18px 17px 16px;
      }

      .live {
        margin-bottom: 10px;
      }

      .logo-wrap {
        width: 72px;
        height: 72px;
        border-radius: 19px;
        margin-bottom: 10px;
      }

      .logo-wrap img {
        border-radius: 16px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .subtitle {
        margin-bottom: 12px;
      }

      .stats {
        margin-bottom: 11px;
      }

      .status {
        margin-bottom: 9px;
      }

      .join-btn {
        min-height: 50px;
      }
    }
  </style>

</head>

<body>

  <main class="page">

    <section class="card">

      <div class="live">
        <span class="dot"></span>
        LIVE ANALYSIS
      </div>

      <div class="logo-wrap">
        <img src="logo.png" alt="Analyst Viraj">
      </div>

      <h1>
        Analyst <span>Viraj</span>
      </h1>

      <p class="subtitle">
        Cricket Match Analysis • Trading Insights<br>
        Stay updated. Stay informed.
      </p>

      <div class="stats">
        <div class="stat">
          <strong>CRICKET</strong>
          <small>Analysis</small>
        </div>

        <div class="stat">
          <strong>LIVE</strong>
          <small>Updates</small>
        </div>

        <div class="stat">
          <strong>DAILY</strong>
          <small>Insights</small>
        </div>
      </div>

      <div class="status">
        <i></i>
        Channel is active & updating
      </div>

      <!-- SIMPLE DIRECT CTA BUTTON -->
      <button
        type="button"
        class="join-btn"
        onclick="window.location.href='https://t.me/+b57ysPut4pwxNDZl';">

        <span class="btn-main">JOIN ANALYST VIRAJ</span>
        <span class="btn-sub">Get Cricket Updates</span>

      </button>

      <div class="note">
        Analysis & information for entertainment purposes.
      </div>

    </section>

  </main>

</body>
</html>
